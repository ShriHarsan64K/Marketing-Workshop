{% extends "base.html" %}{% from "_macros.html" import csrf %}{% block title %}Admin login · {{ site.name }}{% endblock %}
{% block body %}<main id="main" style="max-width:420px"><h1>Login</h1>
{% if err %}<p class="bad" role="alert">{{ err }}</p>{% endif %}
<form method="post">{{ csrf() }}<label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn" style="margin-top:18px">Log in</button></form></main>{% endblock %}
